name: CI Pipeline

on:
    push:
        branches:
            - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set .net SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0

      - name: Install dependencies
        run: dotnet restore

      - name: Run tests
        run: dotnet test